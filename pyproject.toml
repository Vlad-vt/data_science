[project]
name = "kaggle-experiments"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Влад", email = "19Titov.vlad.Titov19@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "kagglehub>=1.0.3",
    "pandas>=3.1.1",
    "pandera>=0.36.0",
    "pyarrow>=26.0.1",
    "pydantic>=2.14.4",
]

[project.scripts]
kaggle-experiments = "kaggle_experiments.main:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.6",
]
